<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Icône de fusion de pages PDF" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B6B"/>
      <stop offset="1" stop-color="#C62839"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Pages arrière (documents sources) -->
  <rect x="112" y="116" width="190" height="250" rx="22" fill="#fff" opacity="0.5" transform="rotate(-12 256 256)"/>
  <rect x="210" y="116" width="190" height="250" rx="22" fill="#fff" opacity="0.35" transform="rotate(12 256 256)"/>

  <!-- Page centrale (résultat fusionné) -->
  <g filter="url(#shadow)">
    <path d="M156 134a24 24 0 0 1 24-24H300L356 166V334a24 24 0 0 1-24 24H180a24 24 0 0 1-24-24Z" fill="#fff"/>
  </g>
  <path d="M300 110V150a16 16 0 0 0 16 16H356Z" fill="#FFD3D6"/>

  <!-- Contenu de la page -->
  <rect x="184" y="196" width="100" height="14" rx="7" fill="#E8505B"/>
  <rect x="184" y="226" width="144" height="12" rx="6" fill="#F1B7BC"/>
  <rect x="184" y="250" width="144" height="12" rx="6" fill="#F1B7BC"/>
  <rect x="184" y="274" width="110" height="12" rx="6" fill="#F1B7BC"/>

  <!-- Badge de fusion -->
  <g filter="url(#shadow)">
    <circle cx="372" cy="372" r="78" fill="#1F2937"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M340 336C340 360 372 358 372 382"/>
    <path d="M404 336C404 360 372 358 372 382"/>
    <path d="M372 382V408"/>
    <path d="M356 394L372 410L388 394"/>
  </g>
</svg>
