[package]
name = "pdfmerge-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

build = "build.rs"

[dependencies]
pdfmerge-core.workspace = true
lopdf.workspace = true
anyhow.workspace = true
clap.workspace = true
slint = { workspace = true, features = ["unstable-winit-030"] }
rfd = { workspace = true }
chrono.workspace = true

[build-dependencies]
slint-build.workspace = true
winres = "0.1"

[dev-dependencies]
assert_cmd.workspace = true
tempfile.workspace = true

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[[bin]]
name = "pdfmerge"
path = "src/main.rs"
